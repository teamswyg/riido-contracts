name: provider-recovery-design

on:
  pull_request:
    paths: ["assignment/**", "tools/providerrecoverydesign/**", "docs/20-domain/provider-recovery*", ".github/workflows/provider-recovery-design.yml"]
  push:
    branches: [main]
    paths: ["assignment/**", "tools/providerrecoverydesign/**", "docs/20-domain/provider-recovery*", ".github/workflows/provider-recovery-design.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./assignment ./tools/providerrecoverydesign -count=1
      - run: go run ./tools/providerrecoverydesign -check-doc
